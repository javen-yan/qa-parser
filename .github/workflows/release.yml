name: Build and publish release
run-name: ${{ github.event_name == 'push' && github.ref_name || format('{0} release {1}', inputs.operation, inputs.release_id) }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      operation:
        description: Build new candidates, or resume an existing verified Release
        type: choice
        options: [build, resume]
        default: build
      source_ref:
        description: Existing immutable version tag to build from main (optional)
        type: string
        default: ''
      release_id:
        description: Existing Release ID (required for resume; no rebuild)
        type: string
        default: ''
      delivery_runner:
        description: Hosted, or one-time local runner for delivery only
        type: choice
        options: [hosted, local]
        default: hosted
      retire_ids:
        description: Explicit comma-separated old Release IDs to retire after verified delivery
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: qa-parser-release-lifecycle
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip

jobs:
  prepare:
    if: inputs.operation != 'resume'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      source_commit: ${{ steps.source.outputs.commit }}
      release_id: ${{ steps.draft.outputs.release_id }}
      tag: ${{ steps.draft.outputs.tag }}
      mode: ${{ steps.draft.outputs.mode }}
      url: ${{ steps.draft.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ inputs.source_ref || github.sha }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-infra
      - name: Bind checked out product source
        id: source
        shell: bash
        run: echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.3'
      - name: Create new run-owned draft (never replace an existing release)
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ (github.event_name == 'push' || inputs.source_ref != '') && 'tag' || 'manual' }}
          RELEASE_TAG: ${{ inputs.source_ref || github.ref_name }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: python .release-infra/scripts/prepare_source_release.py

  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_commit }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-infra
      - uses: ./.release-infra/.github/actions/build-windows
        with:
          upload-artifacts: 'false'
      - name: Upload verified Windows candidate directly to this draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          python .release-infra/scripts/release_draft.py upload --commit "${{ needs.prepare.outputs.source_commit }}" --release-id "$env:RELEASE_ID" --target windows-x64 --archive dist/qa-parser-windows-x64-candidate.zip
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload or digest validation failed' }

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          ref: ${{ needs.prepare.outputs.source_commit }}
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .release-infra
      - uses: ./.release-infra/.github/actions/build-macos
        with:
          architecture: ${{ matrix.architecture }}
          upload-artifacts: 'false'
      - name: Upload verified Mac candidate directly to this draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TARGET: macos-${{ matrix.architecture }}
        run: python .release-infra/scripts/release_draft.py upload --commit "${{ needs.prepare.outputs.source_commit }}" --release-id "$RELEASE_ID" --target "$TARGET" --archive "dist/qa-parser-$TARGET-candidate.zip"

  deliver:
    needs: [prepare, windows, macos]
    if: ${{ always() && !cancelled() && (inputs.operation == 'resume' || (needs.prepare.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success')) }}
    runs-on: ${{ inputs.delivery_runner == 'local' && fromJSON('["qa-parser-release-local"]') || fromJSON('["ubuntu-24.04"]') }}
    timeout-minutes: 120
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        if: inputs.delivery_runner != 'local'
        with:
          python-version: '3.13.3'
      - name: Install isolated upload dependencies (no secrets)
        shell: bash
        run: |
          set -euo pipefail
          python3 -m venv "$RUNNER_TEMP/release-venv"
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --require-hashes -r requirements-macos-bootstrap.lock
          "$RUNNER_TEMP/release-venv/bin/python" -m pip install --no-build-isolation --require-hashes -r requirements-oss.lock
      - name: Verify native jobs, resume delivery, verify public downloads and clean mirrored assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.operation == 'resume' && inputs.release_id || needs.prepare.outputs.release_id }}
          RETIRE_IDS: ${{ inputs.retire_ids }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PUBLIC_BASE_URL: ${{ secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          evidence="${QA_RELEASE_EVIDENCE_DIR:-$RUNNER_TEMP/release-evidence}"
          "$RUNNER_TEMP/release-venv/bin/python" scripts/publish_pipeline.py --release-id "$RELEASE_ID" --retire-ids "$RETIRE_IDS" --work "$RUNNER_TEMP/release-work" --evidence "$evidence"
