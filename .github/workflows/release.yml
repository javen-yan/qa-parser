name: Native release via owned draft
run-name: ${{ github.event_name == 'push' && github.ref_name || 'Manual three-platform draft' }}

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qa-parser-release-lifecycle
  cancel-in-progress: false

env:
  PYTHONUTF8: '1'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'
  PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
      tag: ${{ steps.draft.outputs.tag }}
      mode: ${{ steps.draft.outputs.mode }}
      url: ${{ steps.draft.outputs.url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.3'
      - name: Create new run-owned draft (never replace an existing release)
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_MODE: ${{ github.event_name == 'push' && 'tag' || 'manual' }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/release_draft.py prepare --mode "$RELEASE_MODE" --tag "$RELEASE_TAG"

  windows:
    needs: prepare
    runs-on: windows-2022
    timeout-minutes: 90
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-windows
        with:
          upload-artifacts: 'false'
      - name: Upload verified Windows candidate directly to this draft
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: |
          python scripts/release_draft.py upload --release-id "$env:RELEASE_ID" --target windows-x64 --archive dist/qa-parser-windows-x64-candidate.zip
          if ($LASTEXITCODE -ne 0) { throw 'Draft asset upload or digest validation failed' }

  macos:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: arm64
            runner: macos-15
          - architecture: x86_64
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: '15.0'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-macos
        with:
          architecture: ${{ matrix.architecture }}
          upload-artifacts: 'false'
      - name: Upload verified Mac candidate directly to this draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          TARGET: macos-${{ matrix.architecture }}
        run: python scripts/release_draft.py upload --release-id "$RELEASE_ID" --target "$TARGET" --archive "dist/qa-parser-$TARGET-candidate.zip"

  finalize:
    needs: [prepare, windows, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13.3'
      - name: Verify complete native set, assemble and finalize owned draft
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        run: python scripts/release_draft.py finalize --release-id "$RELEASE_ID"
