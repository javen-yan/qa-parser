name: Windows portable candidate

on:
  workflow_call:
    inputs:
      upload_artifacts:
        type: boolean
        default: false
      probe_only:
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: windows-portable-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_CACHE_DIR: ${{ github.workspace }}/.cache/pip
    steps:
      - name: Prepare tiny Actions storage probe
        run: |
          'qa-parser Windows Actions artifact storage probe' | Set-Content -Encoding utf8 (Join-Path $env:RUNNER_TEMP 'qa-parser-quota-probe.txt')
      - name: Verify Actions artifact quota before building
        if: inputs.probe_only || inputs.upload_artifacts
        id: quota-probe
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-quota-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/qa-parser-quota-probe.txt
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: ${{ !inputs.probe_only }}
        with:
          persist-credentials: false
      - uses: ./.github/actions/build-windows
        if: ${{ !inputs.probe_only }}
        with:
          upload-artifacts: ${{ inputs.upload_artifacts && 'true' || 'false' }}
