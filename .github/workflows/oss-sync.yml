name: Optional verified Release to OSS
on:
  workflow_run:
    workflows: [Native release via owned draft]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      release_id:
        description: Existing owned GitHub Release numeric ID
        required: true
        type: string
      target:
        type: choice
        default: windows-x64
        options: [windows-x64, macos-arm64, macos-x86_64, all]
      plan_only:
        description: Validate metadata and destination without uploading
        type: boolean
        default: true
      cleanup_draft:
        description: Retain candidate Release with OSS links and remove verified mirrored attachments
        type: boolean
        default: true
permissions:
  # GitHub requires push access to see private draft Release assets.
  # Optional cleanup removes verified attachments only; retains Release and source.
  contents: write
  actions: read
jobs:
  resolve:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.resolve.outputs.release_id }}
      skip: ${{ steps.resolve.outputs.skip }}
      target: ${{ steps.resolve.outputs.target }}
      plan_only: ${{ steps.resolve.outputs.plan_only }}
      cleanup_draft: ${{ steps.resolve.outputs.cleanup_draft }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/resolve_oss_release.py
  sync:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    concurrency:
      group: oss-${{ needs.resolve.outputs.release_id }}
      cancel-in-progress: false
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event_name == 'workflow_run' && 'main' || github.ref }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify pinned distribution SDK (no credentials)
        run: |
          python -m pip install --require-hashes -r requirements-macos-bootstrap.lock
          python -m pip install --no-build-isolation --require-hashes -r requirements-oss.lock
          python -c 'import oss2; assert callable(oss2.AuthV4)'
      - name: Verify configuration and sync selected native candidates
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ needs.resolve.outputs.release_id }}
          TARGET: ${{ needs.resolve.outputs.target }}
          PLAN_ONLY: ${{ needs.resolve.outputs.plan_only }}
          CLEANUP_DRAFT: ${{ needs.resolve.outputs.cleanup_draft }}
          ALIYUN_OSS_ACCESS_KEY_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          ALIYUN_OSS_ACCESS_KEY_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          ALIYUN_OSS_BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ALIYUN_OSS_REGION: ${{ secrets.ALIYUN_OSS_REGION }}
          ALIYUN_OSS_ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          ALIYUN_OSS_PUBLIC_BASE_URL: ${{ secrets.ALIYUN_OSS_PUBLIC_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ "$PLAN_ONLY" = true ]; then
            args+=(--plan-only)
          else
            if [ "$CLEANUP_DRAFT" = true ]; then args+=(--cleanup-draft); fi
            PYTHONPATH=scripts python -c 'from sync_release_oss import settings; import os; settings(os.environ)'
          fi
          python scripts/sync_release_oss.py --release-id "$RELEASE_ID" --target "$TARGET" --work "$RUNNER_TEMP/oss-sync" "${args[@]}"
