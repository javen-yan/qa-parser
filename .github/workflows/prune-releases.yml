name: Retain one verified formal Release
on:
  workflow_dispatch:
    inputs:
      keep_id:
        description: Verified published formal Release numeric ID to retain
        required: true
        type: string
      expected_ids:
        description: Explicit comma-separated historical Release IDs to remove
        required: true
        type: string
      apply:
        description: Delete only the exact verified historical Release set
        type: boolean
        default: false
permissions:
  contents: write
  actions: read
concurrency:
  group: qa-parser-release-lifecycle
  cancel-in-progress: false
jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify formal delivery then retire exact historical Releases
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_ID: ${{ inputs.keep_id }}
          EXPECTED_IDS: ${{ inputs.expected_ids }}
          APPLY: ${{ inputs.apply }}
        run: |
          set -euo pipefail
          args=()
          if [ "$APPLY" = true ]; then args+=(--apply); fi
          python scripts/prune_releases.py --keep-id "$KEEP_ID" --expected-ids "$EXPECTED_IDS" --report "$RUNNER_TEMP/release-prune-report.json" "${args[@]}"
