name: Build and validate macos portable candidate
description: Native build plus actual relocated frozen CLI and window checks
inputs:
  upload-artifacts:
    description: Use Actions artifact storage for ordinary CI
    default: 'true'
  architecture:
    description: Native arm64 or x86_64
    required: true
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.13.3'
        architecture: ${{ inputs.architecture == 'arm64' && 'arm64' || 'x64' }}
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
    - name: Assert native architecture
      shell: bash
      run: |
        export GITHUB_SHA="$(git rev-parse HEAD)"
        test "$(uname -m)" = '${{ inputs.architecture }}'
        python -c "import platform; assert platform.machine() == '${{ inputs.architecture }}'"
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: |
          ${{ github.workspace }}/.cache/pip
          ~/Library/Caches/qa-parser-macos/downloads
        key: qa-macos15-${{ inputs.architecture }}-py3133-v1-${{ hashFiles('requirements-macos*.lock', 'packaging/macos-runtime-lock.json', 'scripts/macos_ci.py') }}
    - name: Install hash-pinned build dependencies
      shell: bash
      run: |
        export GITHUB_SHA="$(git rev-parse HEAD)"
        python -m pip install -r requirements-macos-bootstrap.lock
        python -m pip install --no-build-isolation -r requirements-macos.lock
        python -m pip install --no-build-isolation --no-deps -e .
    - name: Public synthetic regression
      shell: bash
      run: |
        export GITHUB_SHA="$(git rev-parse HEAD)"
        python scripts/check_public_tests.py --report build/macos-public-tests.json --junitxml build/macos-public-tests.xml
        node tests/test_math_preview.js
    - name: Build pinned native renderer and light application
      shell: bash
      run: |
        export GITHUB_SHA="$(git rev-parse HEAD)"
        python scripts/macos_ci.py --architecture '${{ inputs.architecture }}'
    - name: Unzip and execute frozen CLI, WMF and Cocoa window
      shell: bash
      run: |
        export GITHUB_SHA="$(git rev-parse HEAD)"
        python scripts/macos_smoke.py --app 'dist/macos/题库转换.app' --out 'build/中文 macOS smoke' --gui --expected-arch '${{ inputs.architecture }}'
    - name: Mixed formula business and native capture checks
      shell: bash
      run: |
        export GITHUB_SHA="$(git rev-parse HEAD)"
        python scripts/mixed_formula_smoke.py --exe 'build/中文 macOS smoke/中文 解压/题库转换.app/Contents/MacOS/题库转换' --out 'build/混合 Mac 验证'
    - name: Composite questions, blank binding and table policy in frozen program
      shell: bash
      run: |
        export GITHUB_SHA="$(git rev-parse HEAD)"
        python scripts/composite_smoke.py --exe 'build/中文 macOS smoke/中文 解压/题库转换.app/Contents/MacOS/题库转换' --out 'build/复合 Mac 验证'
    - name: Prepare exact verified ZIP and checksum
      env:
        QA_ARCH: ${{ inputs.architecture }}
      shell: bash
      run: |
        export GITHUB_SHA="$(git rev-parse HEAD)"
        cp 'build/中文 macOS smoke/portable-candidate.zip' "dist/qa-parser-macos-${QA_ARCH}-candidate.zip"
        python scripts/candidate_metadata.py --archive "dist/qa-parser-macos-${QA_ARCH}-candidate.zip" --smoke 'build/中文 macOS smoke/smoke-report.json' --target "macos-${QA_ARCH}" --output dist/release-metadata.json --runtime-lock packaging/macos-runtime-lock.json --composite 'build/复合 Mac 验证/composite-report.json'
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: success() && inputs.upload-artifacts == 'true'
      with:
        name: qa-parser-macos-${{ inputs.architecture }}-candidate
        path: |
          dist/qa-parser-macos-${{ inputs.architecture }}-candidate.zip
          dist/release-metadata.json
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always() && inputs.upload-artifacts == 'true'
      with:
        name: macos-${{ inputs.architecture }}-build-evidence
        path: |
          build/macos-public-tests.json
          build/macos-public-tests.xml
          build/macos-ci/build-manifest.json
          build/macos-ci/resources-manifest.json
          build/macos-ci/*.log
          build/复合 Mac 验证/composite-report.json
          build/中文 macOS smoke/smoke-report.json
          build/中文 macOS smoke/native-window.json
          build/中文 macOS smoke/native-wmf.json
          build/中文 macOS smoke/*.log
          build/中文 macOS smoke/development/*.log
          build/中文 macOS smoke/frozen/*.log
        if-no-files-found: warn
        retention-days: 14
