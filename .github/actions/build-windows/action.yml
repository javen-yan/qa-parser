name: Build and validate windows portable candidate
description: Native build plus actual relocated frozen CLI and window checks
inputs:
  upload-artifacts:
    description: Use Actions artifact storage for ordinary CI
    default: 'true'
runs:
  using: composite
  steps:
    - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
      with:
        python-version: '3.13.3'
        architecture: x64
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: '22'
    - name: Restore hash-checked Python downloads
      id: cache-python
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .cache/pip
        key: pip-windows-2022-${{ runner.os }}-${{ runner.arch }}-py3133-${{ hashFiles('requirements-windows*.lock') }}
    - name: Restore pinned native download archives
      id: cache-native
      uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: build/windows/downloads
        key: native-windows-2022-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('packaging/windows-runtime-lock.json') }}
    - name: Install build-only dependencies
      shell: pwsh
      run: |
        $env:GITHUB_SHA = (git rev-parse HEAD).Trim()
        python -m pip install -r requirements-windows-bootstrap.lock
        if ($LASTEXITCODE -ne 0) { throw 'Build backend bootstrap failed' }
        python -m pip install --no-build-isolation -r requirements-windows.lock
        if ($LASTEXITCODE -ne 0) { throw 'Dependency install failed' }
        python -m pip install --no-build-isolation --no-deps -e .
        if ($LASTEXITCODE -ne 0) { throw 'Project install failed' }
    - name: Save Python downloads
      if: steps.cache-python.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: .cache/pip
        key: ${{ steps.cache-python.outputs.cache-primary-key }}
    - name: Public synthetic regression (private corpus excluded explicitly)
      shell: pwsh
      run: |
        $env:GITHUB_SHA = (git rev-parse HEAD).Trim()
        python scripts/check_public_tests.py --report build/windows-public-tests.json --junitxml build/windows-public-tests.xml
        if ($LASTEXITCODE -ne 0) { throw 'Regression failed' }
        node tests/test_math_preview.js
        if ($LASTEXITCODE -ne 0) { throw 'Math display regression failed' }
    - name: Build native portable folder with pinned offline resources
      shell: pwsh
      run: |
        $env:GITHUB_SHA = (git rev-parse HEAD).Trim()
        ./packaging/windows-build.ps1
    - name: Save validated native downloads
      if: steps.cache-native.outputs.cache-hit != 'true'
      uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: build/windows/downloads
        key: ${{ steps.cache-native.outputs.cache-primary-key }}
    - name: Frozen CLI, native window and relocated-resource checks
      shell: pwsh
      run: |
        $env:GITHUB_SHA = (git rev-parse HEAD).Trim()
        python scripts/windows_smoke.py --exe 'dist/windows/题库转换/题库转换.exe' --out 'build/中文 Windows smoke' --gui
        if ($LASTEXITCODE -ne 0) { throw 'Frozen application smoke failed' }
    - name: Startup diagnostics and controlled Internet-zone reproduction
      shell: pwsh
      run: |
        $env:GITHUB_SHA = (git rev-parse HEAD).Trim()
        python scripts/windows_startup_smoke.py --exe 'build/中文 Windows smoke/中文 解压/题库转换/题库转换.exe' --out 'build/Windows startup diagnostics'
        if ($LASTEXITCODE -ne 0) { throw 'Startup diagnostics regression failed' }
    - name: Mixed formula business and native capture checks
      shell: pwsh
      run: |
        $env:GITHUB_SHA = (git rev-parse HEAD).Trim()
        python scripts/mixed_formula_smoke.py --exe 'build/中文 Windows smoke/中文 解压/题库转换/题库转换.exe' --out 'build/混合 Windows 验证'
        if ($LASTEXITCODE -ne 0) { throw 'Mixed formula acceptance failed' }
    - name: Composite questions, blank binding and table policy in frozen program
      shell: pwsh
      run: |
        $env:GITHUB_SHA = (git rev-parse HEAD).Trim()
        python scripts/composite_smoke.py --exe 'build/中文 Windows smoke/中文 解压/题库转换/题库转换.exe' --out 'build/复合 Windows 验证'
        if ($LASTEXITCODE -ne 0) { throw 'Composite frozen acceptance failed' }
    - name: Build signed Windows split distribution
      shell: pwsh
      run: |
        python scripts/build_windows_distribution.py
        if ($LASTEXITCODE -ne 0) { throw 'Signed split build failed; configure fixed release keys' }
        python scripts/windows_smoke.py --exe 'dist/windows-split/题库转换/题库转换.exe' --out 'build/Windows split smoke' --gui
        if ($LASTEXITCODE -ne 0) { throw 'Split native acceptance failed' }
        python scripts/windows_update_smoke.py --root 'dist/windows-split/题库转换' --out 'build/Windows update acceptance'
        if ($LASTEXITCODE -ne 0) { throw 'Signed offline upgrade/rollback acceptance failed' }
    - name: Create portable ZIP only after successful smoke
      shell: pwsh
      run: |
        $env:GITHUB_SHA = (git rev-parse HEAD).Trim()
        Copy-Item 'build/Windows split smoke/portable-candidate.zip' 'dist/qa-parser-windows-x64-candidate.zip'
        python scripts/candidate_metadata.py --archive dist/qa-parser-windows-x64-candidate.zip --smoke 'build/Windows split smoke/smoke-report.json' --target windows-x64 --output dist/release-metadata.json --runtime-lock packaging/windows-runtime-lock.json --startup 'build/Windows startup diagnostics/summary.json' --composite 'build/复合 Windows 验证/composite-report.json' --windows-update 'build/Windows update acceptance/update-validation.json'
        if ($LASTEXITCODE -ne 0) { throw 'Candidate metadata validation failed' }
        Get-FileHash 'dist/qa-parser-windows-x64-candidate.zip' -Algorithm SHA256 | Format-List | Out-File 'build/windows-zip-sha256.txt'
        @'
        Windows Server 2022 x64 runner candidate. Synthetic tests only.
        Real 9-document corpus: NOT UPLOADED / NOT VERIFIED on Windows.
        Customer Windows 11 offline/non-admin/read-only-folder acceptance: pending.
        Original-WMF LibreOffice extension: not enabled on Windows.
        '@ | Out-File 'build/windows-acceptance-scope.txt' -Encoding utf8
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: success() && inputs.upload-artifacts == 'true'
      with:
        name: qa-parser-windows-x64-candidate
        path: |
          dist/qa-parser-windows-x64-candidate.zip
          dist/release-metadata.json
          dist/qa-parser-windows-x64.qaupdate
          dist/qa-parser-windows-x64-runtime.zip
          dist/windows-distribution-size.json
        if-no-files-found: error
        retention-days: 14
        compression-level: 0
    - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
      if: always() && inputs.upload-artifacts == 'true'
      with:
        name: windows-build-evidence
        path: |
          build/Windows split smoke/*.json
          build/Windows update acceptance/*.json
          build/windows-public-tests.json
          build/windows-public-tests.xml
          build/windows/resources-manifest.json
          build/windows/build-manifest.json
          build/windows-zip-sha256.txt
          build/windows-acceptance-scope.txt
          build/Windows startup diagnostics/*.json
          build/复合 Windows 验证/composite-report.json
          build/中文 Windows smoke/smoke-report.json
          build/中文 Windows smoke/native-window.json
          build/中文 Windows smoke/native-wmf.json
          build/中文 Windows smoke/*.log
          build/中文 Windows smoke/development/*.log
          build/中文 Windows smoke/frozen/*.log
        if-no-files-found: warn
        retention-days: 14
